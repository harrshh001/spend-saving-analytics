version: "1"

databases:
  - name: spend-analytics-db
    databaseName: spend_db
    user: spend_user
    plan: free
    region: oregon

services:
  # Backend API service
  - type: web
    name: spend-analytics-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spend-analytics-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        sync: false
